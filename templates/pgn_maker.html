<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <title>PGN Maker</title>

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">

    <!-- JS (chessboard.js needs jQuery) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" onerror="console.error('Failed to load jQuery')"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js" onerror="console.error('Failed to load chess.js')"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js" onerror="console.error('Failed to load chessboard.js')"></script>
    <script src="{{ url_for('static', filename='board2.js') }}"></script>
</head>
<body>
  <div class="pgn-maker-container">
    <!-- Main Split -->
    <div class="main-section">
      <div class="text-input">
        <h3>Type Moves</h3>
          <div class="meta-inputs">
            <label>Event: <input type="text" id="event" placeholder="Casual Game"></label>
            <label>Site: <input type="text" id="site" placeholder="Online"></label>
            <label>Date: <input type="date" id="date" class="dateUpload"></label>
            <label>Round: <input type="text" id="round" placeholder="1"></label>
            <label>White: <input type="text" id="white" placeholder="White Player"></label>
            <label>Black: <input type="text" id="black" placeholder="Black Player"></label>
            <label>Result:
                <select id="result">
                <option value="*">*</option>
                <option value="1-0">1-0</option>
                <option value="0-1">0-1</option>
                <option value="1/2-1/2">1/2-1/2</option>
                </select>
            </label>
            </div>
        <textarea id="moveInput" placeholder="1. e4 e5"></textarea>
        <p id="move-status" class="move-status"></p>
      </div>

      <!--Right: board (drag pieces or type moves) -->
      <div class="board-area">
        <h3>Chessboard</h3>
        <div id="myBoard" style="width: 100%; max-width: 400px;"></div>
      </div>
    </div>

    <!-- Bottom Output -->
    <div class="output-section">
      <div class="buttons">
        <button type="button" class="copy-btn" id="copy-btn">Copy</button>
        <button type="button" class="download-btn" id="download-btn">Download</button>
        <button type="button" class="attach-btn" id="attach-btn" style="display: none;">Attach to Upload</button>
        <button type="button" id="clear-btn">Clear</button>
      </div>
    </div>

  </div>
</body>
</html>
